<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar fotos · Mome</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .editor { padding-bottom: 80px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 20px; }
    .slot-card { border: 1px solid rgba(160,120,70,0.28); border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; }
    .slot-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .slot-card p { font-size: 12px; text-align: center; padding: 8px; color: #9b7a52; }
    .slot-card.elegida { outline: 2px solid #c0785a; }
    .slot-card.icono { min-height: 120px; display: flex; flex-direction: column; }
    .slot-card.icono .glyph { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 42px; }
    .estado { min-height: 1.4em; color: #9b7a52; font-style: italic; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="editor">
    <h1>Fotos de Mome</h1>
    <p class="lead">Cambia una foto, añade otra al polaroid o sube la canción. No hace falta GitHub.</p>

    <label>Qué quieres cambiar</label>
    <div class="slots" id="slots"></div>

    <label for="foto">Archivo nuevo</label>
    <input id="foto" type="file" accept="image/*">

    <label for="pin">PIN</label>
    <input id="pin" type="password" autocomplete="current-password" placeholder="El que pusiste en Render">

    <div class="acciones">
      <button type="button" id="btnSubir">Guardar</button>
      <button type="button" class="secundario" id="btnAnadir">Añadir foto</button>
      <a class="btn secundario" href="/mome/">Ver la sorpresa</a>
    </div>
    <p class="estado" id="estado">Para sumar una al polaroid: Añadir foto → elige la imagen → PIN → Guardar. Espera ~1 minuto y recarga /mome.</p>
  </div>
  <script>
    var slot = "1";
    var wrap = document.getElementById("slots");
    var estado = document.getElementById("estado");
    var btnAnadir = document.getElementById("btnAnadir");
    var siguiente = 7;
    var maxFotos = 12;

    function pintarSlots(fotos) {
      fotos = fotos || [];
      var items = fotos.map(function (src, i) {
        var n = String(i + 1);
        var m = src.match(/\/(\d+)\.jpe?g$/i);
        if (m) n = m[1];
        return [n, "Polaroid " + n, src];
      });
      items.push(["final", "Foto final", "/mome/fotos/final.jpg"]);
      items.push(["cancion", "Canción", ""]);
      wrap.innerHTML = items.map(function (it, i) {
        var inner = it[0] === "cancion"
          ? '<div class="glyph">♪</div>'
          : '<img src="' + it[2] + '?t=' + Date.now() + '" alt="' + it[1] + '">';
        var extra = it[0] === "cancion" ? " icono" : "";
        return '<div class="slot-card' + extra + (i === 0 ? " elegida" : "") + '" data-slot="' + it[0] + '">' +
          inner + "<p>" + it[1] + "</p></div>";
      }).join("");
      slot = items[0] ? items[0][0] : "1";
      var lleno = siguiente > maxFotos;
      btnAnadir.disabled = lleno;
      btnAnadir.textContent = lleno ? "Máximo 12 fotos" : "Añadir foto";
    }

    function cargarEstado() {
      return fetch("/mome/api/estado")
        .then(function (r) { return r.json(); })
        .then(function (j) {
          maxFotos = j.max || 12;
          siguiente = j.siguiente || ((j.fotos || []).length + 1);
          pintarSlots(j.fotos);
        })
        .catch(function () { pintarSlots(["/mome/fotos/1.jpg","/mome/fotos/2.jpg","/mome/fotos/3.jpg","/mome/fotos/4.jpg","/mome/fotos/5.jpg","/mome/fotos/6.jpg"]); });
    }
    cargarEstado();

    wrap.addEventListener("click", function (e) {
      var card = e.target.closest(".slot-card");
      if (!card) return;
      slot = card.getAttribute("data-slot");
      wrap.querySelectorAll(".slot-card").forEach(function (c) {
        c.classList.toggle("elegida", c === card);
      });
      document.getElementById("foto").accept = slot === "cancion" ? "audio/*" : "image/*";
      estado.textContent = slot === "nueva"
        ? "Va a ser la polaroid " + siguiente + ". Elige la imagen, pon el PIN y Guardar."
        : "Reemplaza esta y pulsa Guardar.";
    });

    btnAnadir.addEventListener("click", function () {
      if (siguiente > maxFotos) {
        estado.textContent = "Ya hay 12 polaroids (máximo).";
        return;
      }
      slot = "nueva";
      wrap.querySelectorAll(".slot-card").forEach(function (c) { c.classList.remove("elegida"); });
      document.getElementById("foto").accept = "image/*";
      document.getElementById("foto").click();
      estado.textContent = "Nueva polaroid (será la " + siguiente + "). Elige la imagen, PIN y Guardar.";
    });

    document.getElementById("btnSubir").addEventListener("click", function () {
      var file = document.getElementById("foto").files[0];
      var pin = document.getElementById("pin").value;
      if (!file) { estado.textContent = slot === "cancion" ? "Elige un mp3." : "Elige una imagen."; return; }
      if (!pin) { estado.textContent = "Escribe el PIN."; return; }
      var data = new FormData();
      data.append("slot", slot);
      data.append("pin", pin);
      data.append("foto", file);
      estado.textContent = "Subiendo…";
      fetch("/mome/api/foto", { method: "POST", body: data })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { estado.textContent = res.j.error || "No se pudo guardar."; return; }
          estado.textContent = res.j.mensaje || "Listo. Espera ~1 minuto y recarga /mome.";
          document.getElementById("foto").value = "";
          slot = "1";
          cargarEstado();
        })
        .catch(function () { estado.textContent = "Error de red. Inténtalo de nuevo."; });
    });
  </script>
</body>
</html>
